<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 290" width="850" height="290" role="img" aria-label="Sunny More — Developer Header Datasheet">
  <defs>
    <!-- Subtle Dotted Grid Pattern -->
    <pattern id="header-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#30363d" fill-opacity="0.45" />
    </pattern>

    <!-- Retro Green Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#4ade80" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>

    <!-- Status Dot Glow Filter -->
    <filter id="green-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#22c55e" flood-opacity="0.85"/>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Card Background & Subtle Grid Pattern -->
  <rect x="0.5" y="0.5" width="849" height="289" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <rect x="0.5" y="0.5" width="849" height="289" rx="12" fill="url(#header-grid)" />

  <!-- Vertical Dividing Line: Left Panel (62%) and Right Table (38%) -->
  <line x1="527" y1="0.5" x2="527" y2="289.5" stroke="#30363d" stroke-width="1" />

  <!-- ==================== LEFT PANEL (62% WIDTH) ==================== -->
  <g transform="translate(44, 0)">
    <!-- Small Red Accent Bar above Name -->
    <rect x="0" y="66" width="38" height="4" rx="2" fill="#ef4444" />

    <!-- Large Retro Glowing Green Neon Outline Typography: SUNNY MORE -->
    <text x="0" y="136" class="mono" font-size="44" font-weight="900" letter-spacing="2.5" fill="rgba(74, 222, 128, 0.06)" stroke="#4ade80" stroke-width="2" filter="url(#neon-glow)">SUNNY MORE</text>

    <!-- Small Vertical Red Accent Block at Bottom-Right Corner of Name -->
    <rect x="336" y="112" width="5" height="24" rx="2" fill="#ef4444" />

    <!-- Monospace Terminal Text directly below Name -->
    <g transform="translate(0, 185)" class="mono" font-size="15" font-weight="500">
      <text x="0" y="0">
        <tspan fill="#8b949e">&gt; </tspan>
        <tspan fill="#c9d1d9">React</tspan>
        <tspan fill="#6e7681"> · </tspan>
        <tspan fill="#c9d1d9">Node.js</tspan>
        <tspan fill="#6e7681"> · </tspan>
        <tspan fill="#c9d1d9">TypeScript</tspan>
      </text>
      <!-- Solid Orange Vertical Block Cursor -->
      <rect x="290" y="-14" width="9" height="17" fill="#d97706">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- ==================== RIGHT TABLE (38% WIDTH: 4 ROW CELLS) ==================== -->
  <!-- Horizontal Borders separating the 4 rows -->
  <line x1="527" y1="72.5" x2="850" y2="72.5" stroke="#30363d" stroke-width="1" />
  <line x1="527" y1="145" x2="850" y2="145" stroke="#30363d" stroke-width="1" />
  <line x1="527" y1="217.5" x2="850" y2="217.5" stroke="#30363d" stroke-width="1" />

  <!-- Row 1: EDUCATION -->
  <g transform="translate(552, 0)" class="mono">
    <text x="0" y="32" font-size="11" font-weight="600" fill="#6e7681" letter-spacing="1">EDUCATION</text>
    <text x="0" y="54" font-size="13.5" font-weight="600" fill="#e6edf3">B.Tech AI &amp; DS Student</text>
  </g>

  <!-- Row 2: BASE -->
  <g transform="translate(552, 0)" class="mono">
    <text x="0" y="104" font-size="11" font-weight="600" fill="#6e7681" letter-spacing="1">BASE</text>
    <text x="0" y="126" font-size="13.5" font-weight="600" fill="#e6edf3">Vadodara, India</text>
  </g>

  <!-- Row 3: FOCUS -->
  <g transform="translate(552, 0)" class="mono">
    <text x="0" y="176" font-size="11" font-weight="600" fill="#6e7681" letter-spacing="1">FOCUS</text>
    <text x="0" y="198" font-size="13.5" font-weight="600" fill="#e6edf3">Full-Stack · AI Agents · AI/ML</text>
  </g>

  <!-- Row 4: STATUS -->
  <g transform="translate(552, 0)" class="mono">
    <text x="0" y="248" font-size="11" font-weight="600" fill="#6e7681" letter-spacing="1">STATUS</text>
    <!-- Green glowing status dot + Open to Roles -->
    <circle cx="6" cy="269" r="4.5" fill="#22c55e" filter="url(#green-glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="273" font-size="13.5" font-weight="600" fill="#e6edf3">Open to Roles</text>
  </g>
</svg>