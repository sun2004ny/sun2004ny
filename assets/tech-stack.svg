<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 155" width="850" height="155" role="img" aria-label="Tech Stack Badges">
  <defs>
    <!-- Background Gradient: Dark Emerald-Slate (#0b1918) -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2321" />
      <stop offset="100%" stop-color="#071413" />
    </linearGradient>

    <!-- Subtle Clean Glow Filter for Title -->
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.4" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .pill-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #ffffff; }
    </style>
  </defs>

  <!-- Container Card: dark emerald-slate background (#0b1918) with glowing emerald-cyan border (#2dd4bf) -->
  <rect x="0.5" y="0.5" width="849" height="154" rx="16" fill="url(#card-bg)" stroke="#2dd4bf" stroke-width="1" />

  <!-- Top-Left Title: Tech Stack in Pure White (#ffffff) -->
  <text x="32" y="28" class="title" filter="url(#white-glow)">Tech Stack</text>

  <!-- ==================== ROW 1 PILL BADGES ==================== -->
  <!-- Python -->
  <g transform="translate(33, 46)">
    <rect width="76" height="32" rx="16" fill="#0d1f1e" stroke="#22c55e" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#22c55e" />
    <text x="24" y="20.5" class="pill-txt">Python</text>
  </g>
  <!-- JavaScript -->
  <g transform="translate(129, 46)">
    <rect width="100" height="32" rx="16" fill="#0d1f1e" stroke="#06b6d4" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#06b6d4" />
    <text x="24" y="20.5" class="pill-txt">JavaScript</text>
  </g>
  <!-- TypeScript -->
  <g transform="translate(249, 46)">
    <rect width="102" height="32" rx="16" fill="#0d1f1e" stroke="#3b82f6" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#3b82f6" />
    <text x="24" y="20.5" class="pill-txt">TypeScript</text>
  </g>
  <!-- React -->
  <g transform="translate(371, 46)">
    <rect width="72" height="32" rx="16" fill="#0d1f1e" stroke="#22c55e" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#22c55e" />
    <text x="24" y="20.5" class="pill-txt">React</text>
  </g>
  <!-- Next.js -->
  <g transform="translate(463, 46)">
    <rect width="80" height="32" rx="16" fill="#0d1f1e" stroke="#06b6d4" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#06b6d4" />
    <text x="24" y="20.5" class="pill-txt">Next.js</text>
  </g>
  <!-- HTML -->
  <g transform="translate(563, 46)">
    <rect width="68" height="32" rx="16" fill="#0d1f1e" stroke="#3b82f6" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#3b82f6" />
    <text x="24" y="20.5" class="pill-txt">HTML</text>
  </g>
  <!-- CSS -->
  <g transform="translate(651, 46)">
    <rect width="62" height="32" rx="16" fill="#0d1f1e" stroke="#22c55e" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#22c55e" />
    <text x="24" y="20.5" class="pill-txt">CSS</text>
  </g>
  <!-- Tailwind -->
  <g transform="translate(733, 46)">
    <rect width="84" height="32" rx="16" fill="#0d1f1e" stroke="#06b6d4" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#06b6d4" />
    <text x="24" y="20.5" class="pill-txt">Tailwind</text>
  </g>

  <!-- ==================== ROW 2 PILL BADGES ==================== -->
  <!-- Node.js -->
  <g transform="translate(32, 96)">
    <rect width="82" height="32" rx="16" fill="#0d1f1e" stroke="#3b82f6" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#3b82f6" />
    <text x="24" y="20.5" class="pill-txt">Node.js</text>
  </g>
  <!-- Express -->
  <g transform="translate(123, 96)">
    <rect width="82" height="32" rx="16" fill="#0d1f1e" stroke="#22c55e" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#22c55e" />
    <text x="24" y="20.5" class="pill-txt">Express</text>
  </g>
  <!-- MongoDB -->
  <g transform="translate(214, 96)">
    <rect width="92" height="32" rx="16" fill="#0d1f1e" stroke="#06b6d4" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#06b6d4" />
    <text x="24" y="20.5" class="pill-txt">MongoDB</text>
  </g>
  <!-- MySQL -->
  <g transform="translate(315, 96)">
    <rect width="76" height="32" rx="16" fill="#0d1f1e" stroke="#3b82f6" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#3b82f6" />
    <text x="24" y="20.5" class="pill-txt">MySQL</text>
  </g>
  <!-- PostgreSQL -->
  <g transform="translate(400, 96)">
    <rect width="104" height="32" rx="16" fill="#0d1f1e" stroke="#22c55e" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#22c55e" />
    <text x="24" y="20.5" class="pill-txt">PostgreSQL</text>
  </g>
  <!-- Firebase -->
  <g transform="translate(513, 96)">
    <rect width="86" height="32" rx="16" fill="#0d1f1e" stroke="#06b6d4" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#06b6d4" />
    <text x="24" y="20.5" class="pill-txt">Firebase</text>
  </g>
  <!-- Docker -->
  <g transform="translate(608, 96)">
    <rect width="78" height="32" rx="16" fill="#0d1f1e" stroke="#3b82f6" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#3b82f6" />
    <text x="24" y="20.5" class="pill-txt">Docker</text>
  </g>
  <!-- GitHub Actions -->
  <g transform="translate(695, 96)">
    <rect width="124" height="32" rx="16" fill="#0d1f1e" stroke="#22c55e" stroke-width="1" />
    <circle cx="13" cy="16" r="3.5" fill="#22c55e" />
    <text x="24" y="20.5" class="pill-txt">GitHub Actions</text>
  </g>
</svg>