name: Generate Contribution Snake

on:
  schedule:
    # Run once every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sun2004ny
          outputs: "dist/github-contribution-grid-snake-dark.svg?color_snake=#a855f7&color_dots=#162b22,#0e4429,#006d32,#26a641,#39d353"
          github_token: ${{ secrets.SNK_TOKEN }}

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
